<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do Baatein | Private chat</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1769aa" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="auth-view" class="auth-layout">
      <div class="auth-panel">
        <div class="brand-mark">DB</div>
        <h1>Do Baatein</h1>
        <p id="auth-subtitle">Login karke chat shuru karein.</p>
        <form id="auth-form">
          <label>Username<input id="username" autocomplete="username" required minlength="3" maxlength="24" placeholder="jaise: rahul_07" /></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="kam se kam 6 characters" /></label>
          <button class="primary-btn" type="submit"><span id="auth-action">Login karein</span><span>→</span></button>
        </form>
        <p id="auth-error" class="form-error" role="alert"></p>
        <button id="toggle-auth" class="text-btn" type="button">Naya account banayein</button>
      </div>
    </section>

    <section id="chat-view" class="chat-layout hidden">
      <header class="topbar">
        <div class="brand"><div class="brand-mark small">DB</div><strong>Do Baatein</strong></div>
        <div class="user-menu"><span class="online-dot"></span><span id="current-user"></span><button id="call-button" class="icon-btn call-button" type="button">Video call</button><button id="logout" class="icon-btn" title="Logout">Logout</button></div>
      </header>
      <div class="chat-main">
        <section id="call-panel" class="call-panel hidden"><div class="call-heading"><strong id="call-status">Video call</strong><button id="hangup-button" class="hangup-button" type="button">End call</button></div><div class="video-grid"><video id="remote-video" autoplay playsinline></video><video id="local-video" autoplay muted playsinline></video></div><div id="incoming-call" class="incoming-call hidden"><span id="incoming-text"></span><button id="accept-call" class="accept-button" type="button">Accept</button><button id="reject-call" class="reject-button" type="button">Reject</button></div></section>
        <section class="conversation"><div class="conversation-head"><div><h2>Chat</h2><span id="presence-text">Connecting...</span></div></div><div id="messages" class="messages"></div><div class="photo-row"><label class="image-btn" title="Photo choose karein">Photo bhejein<input id="image-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden /></label></div><form id="message-form" class="composer"><input id="message-input" autocomplete="off" maxlength="1000" placeholder="Message likhein..." /><button class="send-btn" title="Send" type="submit">Send</button></form></section>
      </div>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body>
</html>
